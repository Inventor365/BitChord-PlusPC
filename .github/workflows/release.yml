name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages, without the leading v"
        required: true
        default: "1.10.0"
      target:
        description: "all, or macos to rebuild only the macOS packages (nothing is published)"
        required: false
        default: "all"
      draft:
        description: "Create as draft (false publishes immediately)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android · Phone, TV & Wear OS APKs
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'macos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Setup Secrets & Deterministic Release Keystore
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER }}
          COLLAB_SERVER: ${{ secrets.COLLAB_SERVER || vars.COLLAB_SERVER }}
          COLLAB_GOOGLE_CLIENT_ID: ${{ secrets.COLLAB_GOOGLE_CLIENT_ID || vars.COLLAB_GOOGLE_CLIENT_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : > local.properties
          [ -n "$LASTFM_API_KEY" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          [ -n "$LASTFM_SECRET" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
          [ -n "$LISTEN_TOGETHER_SERVER" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties
          [ -n "$COLLAB_SERVER" ] && echo "COLLAB_SERVER=$COLLAB_SERVER" >> local.properties
          [ -n "$COLLAB_GOOGLE_CLIENT_ID" ] && echo "COLLAB_GOOGLE_CLIENT_ID=$COLLAB_GOOGLE_CLIENT_ID" >> local.properties
          true # an unset optional value above must not fail the step

          # NEVER generate a random throwaway keystore on release builds: doing so changes
          # the signing certificate SHA-256 on every tag and causes Android PackageManager
          # to reject all OTA / sideload upgrades with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required Android release signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Refusing to generate a random keystore." >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > bitchord-release.jks
          if [ ! -s bitchord-release.jks ]; then
            echo "::error::Decoded bitchord-release.jks is empty!" >&2
            exit 1
          fi
          keytool -list -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - run: chmod +x gradlew scripts/verify-android-upgrade.sh

      - name: Build Signed Phone, Wear OS & Android TV Prod Release APKs
        run: |
          ./gradlew :app:assembleProdRelease :tv:assembleProdRelease \
            -Pbitchord.requireReleaseSigning=true \
            -Dorg.gradle.workers.max=2

      - name: Collect & Verify All 9 APKs
        env:
          EXPECTED_ANDROID_CERT_SHA256: ${{ secrets.EXPECTED_ANDROID_CERT_SHA256 || vars.EXPECTED_ANDROID_CERT_SHA256 }}
        run: |
          v="${{ steps.version.outputs.value }}"
          mkdir -p dist
          cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk "dist/BitChord-v${v}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/prod/release/app-prod-${abi}-release.apk" "dist/BitChord-v${v}_${abi}.apk"
          done
          cp tv/build/outputs/apk/prod/release/tv-prod-universal-release.apk "dist/BitChordTV-v${v}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "tv/build/outputs/apk/prod/release/tv-prod-${abi}-release.apk" "dist/BitChordTV-v${v}_${abi}.apk"
          done
          wear_apk=$(ls wearos/build/outputs/apk/prod/release/*.apk | head -n1)
          cp "$wear_apk" "dist/BitChordWear-v${v}.apk"

          apk_count=$(find dist -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$apk_count" -ne 9 ]; then
            echo "::error::Expected exactly 9 release APKs in dist/, found $apk_count" >&2
            ls -la dist >&2
            exit 1
          fi

          ./scripts/verify-android-upgrade.sh dist
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*

  linux:
    name: Linux · AppImage, deb, rpm
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'macos'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER }}
          COLLAB_SERVER: ${{ secrets.COLLAB_SERVER || vars.COLLAB_SERVER }}
          COLLAB_GOOGLE_CLIENT_ID: ${{ secrets.COLLAB_GOOGLE_CLIENT_ID || vars.COLLAB_GOOGLE_CLIENT_ID }}
        run: |
          : > local.properties
          [ -n "$LASTFM_API_KEY" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          [ -n "$LASTFM_SECRET" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
          [ -n "$LISTEN_TOGETHER_SERVER" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties
          [ -n "$COLLAB_SERVER" ] && echo "COLLAB_SERVER=$COLLAB_SERVER" >> local.properties
          [ -n "$COLLAB_GOOGLE_CLIENT_ID" ] && echo "COLLAB_GOOGLE_CLIENT_ID=$COLLAB_GOOGLE_CLIENT_ID" >> local.properties
          true # an unset optional value above must not fail the step

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test -Pbitchord.version=${{ steps.version.outputs.value }}

      - name: Build deb, rpm and the app image
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            -Pbitchord.version=${{ steps.version.outputs.value }}

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libbitchord_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Build the AppImage
        run: |
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            dist/BitChord-${{ steps.version.outputs.value }}-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"

      - name: Collect
        run: |
          v=${{ steps.version.outputs.value }}
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/BitChord-$v-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/BitChord-$v-linux-x86_64.rpm"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  windows:
    name: Windows · installer, msi, portable
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'macos'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CMake version
        run: cmake --version

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER }}
          COLLAB_SERVER: ${{ secrets.COLLAB_SERVER || vars.COLLAB_SERVER }}
          COLLAB_GOOGLE_CLIENT_ID: ${{ secrets.COLLAB_GOOGLE_CLIENT_ID || vars.COLLAB_GOOGLE_CLIENT_ID }}
        run: |
          : > local.properties
          [ -n "$LASTFM_API_KEY" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          [ -n "$LASTFM_SECRET" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
          [ -n "$LISTEN_TOGETHER_SERVER" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties
          [ -n "$COLLAB_SERVER" ] && echo "COLLAB_SERVER=$COLLAB_SERVER" >> local.properties
          [ -n "$COLLAB_GOOGLE_CLIENT_ID" ] && echo "COLLAB_GOOGLE_CLIENT_ID=$COLLAB_GOOGLE_CLIENT_ID" >> local.properties
          true # an unset optional value above must not fail the step

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopUi:jvmTest :desktopApp:test "-Pbitchord.version=${{ steps.version.outputs.value }}"

      - name: Build msi, exe and the app image
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Pbitchord.version=${{ steps.version.outputs.value }}"

      - name: The analyser and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/bitchord_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          jar tf "$jar" | grep -q 'native/bitchord_smtc.dll'

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/BitChord-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/BitChord-$v-windows-x64-setup.exe"
          7z a -tzip -mx=5 "dist/BitChord-$v-windows-x64-portable.zip" `
            "desktopApp/build/compose/binaries/main/app/BitChord/*" | Out-Null
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  macos:
    name: macOS · dmg, pkg, zip (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 images are retired ("configuration not supported"). Apple Silicon builds
          # on the current arm64 image; Intel builds on a real Intel runner, not under Rosetta.
          - os: macos-15
            arch: arm64
            java_arch: aarch64
          - os: macos-15-intel
            arch: x64
            java_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rosetta 2 for x64 target on Apple Silicon
        if: matrix.arch == 'x64'
        run: |
          if [ "$(uname -m)" = "arm64" ] && ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Set up JDK 21 (${{ matrix.java_arch }})
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: ${{ matrix.java_arch }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version (${{ matrix.arch }})"

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER }}
          COLLAB_SERVER: ${{ secrets.COLLAB_SERVER || vars.COLLAB_SERVER }}
          COLLAB_GOOGLE_CLIENT_ID: ${{ secrets.COLLAB_GOOGLE_CLIENT_ID || vars.COLLAB_GOOGLE_CLIENT_ID }}
        run: |
          : > local.properties
          [ -n "$LASTFM_API_KEY" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          [ -n "$LASTFM_SECRET" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
          [ -n "$LISTEN_TOGETHER_SERVER" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties
          [ -n "$COLLAB_SERVER" ] && echo "COLLAB_SERVER=$COLLAB_SERVER" >> local.properties
          [ -n "$COLLAB_GOOGLE_CLIENT_ID" ] && echo "COLLAB_GOOGLE_CLIENT_ID=$COLLAB_GOOGLE_CLIENT_ID" >> local.properties
          true # an unset optional value above must not fail the step

      - run: chmod +x gradlew scripts/macos/package-macos.py scripts/macos/verify-macos-artifacts.py

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test -Pbitchord.version=${{ steps.version.outputs.value }} -Pbitchord.arch=${{ matrix.arch }}

      - name: Package & Verify macOS DMG, PKG, and ZIP
        env:
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER }}
          COLLAB_SERVER: ${{ secrets.COLLAB_SERVER || vars.COLLAB_SERVER }}
          COLLAB_GOOGLE_CLIENT_ID: ${{ secrets.COLLAB_GOOGLE_CLIENT_ID || vars.COLLAB_GOOGLE_CLIENT_ID }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python3 scripts/macos/package-macos.py \
            --version "${{ steps.version.outputs.value }}" \
            --arch "${{ matrix.arch }}" \
            --output-dir dist
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord.app/Contents/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          ls -lh dist

      # The real test: install the package the way a user would, and start the app.
      - name: Install the .pkg and launch the app
        run: |
          v="${{ steps.version.outputs.value }}"
          sudo installer -pkg "dist/BitChord-${v}-macos-${{ matrix.arch }}.pkg" -target /
          test -x /Applications/BitChord.app/Contents/MacOS/BitChord
          codesign --verify --deep --strict --verbose=2 /Applications/BitChord.app
          file /Applications/BitChord.app/Contents/MacOS/BitChord
          plutil -p /Applications/BitChord.app/Contents/Info.plist | grep -E 'CFBundleShortVersionString|CFBundleIdentifier'
          # Start it and make sure it is still running a few seconds later (a bad bundle or
          # signature is killed at once).
          /Applications/BitChord.app/Contents/MacOS/BitChord > app.log 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            echo "BitChord is running (pid $pid)"
            kill "$pid" || true
          else
            echo "::error::BitChord exited within 20 seconds of launch" >&2
            tail -n 60 app.log >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: dist/*

  web:
    name: Web · player & extension
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'macos'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install, Typecheck, Test & Build Web
        env:
          COREPACK_INTEGRITY_KEYS: '0'
          VITE_PARTY_SERVER_URL: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER || 'https://bitchord-listen-together.onrender.com' }}
          VITE_LISTEN_TOGETHER_URL: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER || 'https://bitchord-listen-together.onrender.com' }}
          VITE_COLLAB_SERVER_URL: ${{ secrets.COLLAB_SERVER || vars.COLLAB_SERVER || '' }}
          VITE_COLLAB_GOOGLE_CLIENT_ID: ${{ secrets.COLLAB_GOOGLE_CLIENT_ID || vars.COLLAB_GOOGLE_CLIENT_ID || '' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm -r typecheck
          pnpm -r test
          pnpm -r build

  release:
    name: Publish
    needs: [android, linux, windows, macos, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - name: Final Cross-Platform Verification Gate
        env:
          EXPECTED_ANDROID_CERT_SHA256: ${{ secrets.EXPECTED_ANDROID_CERT_SHA256 || vars.EXPECTED_ANDROID_CERT_SHA256 }}
        run: |
          ls -lh dist
          chmod +x scripts/verify-android-upgrade.sh scripts/macos/verify-macos-artifacts.py
          ./scripts/verify-android-upgrade.sh dist
          # macOS files were verified, installed and launched on the Mac runners that built
          # them; the Linux structure checker only understands the retired cross-repack layout.
          count=$(ls dist | grep -c -- '-macos-')
          [ "$count" -eq 6 ] || { echo "::error::expected 6 macOS files, found $count" >&2; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Recreate existing release to refresh published timestamp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          gh release delete "$TAG" --repo "$REPO" --yes || true
          gh api -X PATCH "repos/${REPO}/git/refs/tags/$TAG" \
            -f sha="${{ github.sha }}" -F force=true || true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: BitChord ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          body_path: docs/RELEASE_NOTES.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
