name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      run_macos_packaging:
        description: "Run macOS DMG/PKG/ZIP packaging & verification matrix"
        type: boolean
        required: false
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend:
    name: Backend · Go (vet + race tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet & Test with Race Detector
        run: go vet ./... && go test -race ./...

  web:
    name: Web · typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        env:
          COREPACK_INTEGRITY_KEYS: '0'
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck, Test & Build
        env:
          COREPACK_INTEGRITY_KEYS: '0'
          VITE_PARTY_SERVER_URL: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER || 'https://bitchord-listen-together.onrender.com' }}
          VITE_LISTEN_TOGETHER_URL: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER || 'https://bitchord-listen-together.onrender.com' }}
          VITE_COLLAB_SERVER_URL: ${{ secrets.COLLAB_SERVER || vars.COLLAB_SERVER || secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER || 'https://bitchord-listen-together.onrender.com' }}
          VITE_COLLAB_GOOGLE_CLIENT_ID: ${{ secrets.COLLAB_GOOGLE_CLIENT_ID || vars.COLLAB_GOOGLE_CLIENT_ID || '' }}
        run: corepack pnpm -r typecheck && corepack pnpm -r test && corepack pnpm -r build

  jvm-and-android:
    name: JVM & Android · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 & 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER }}
          COLLAB_SERVER: ${{ secrets.COLLAB_SERVER || vars.COLLAB_SERVER }}
          COLLAB_GOOGLE_CLIENT_ID: ${{ secrets.COLLAB_GOOGLE_CLIENT_ID || vars.COLLAB_GOOGLE_CLIENT_ID }}
        run: |
          : > local.properties
          [ -n "$LASTFM_API_KEY" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          [ -n "$LASTFM_SECRET" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
          [ -n "$LISTEN_TOGETHER_SERVER" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties
          [ -n "$COLLAB_SERVER" ] && echo "COLLAB_SERVER=$COLLAB_SERVER" >> local.properties
          [ -n "$COLLAB_GOOGLE_CLIENT_ID" ] && echo "COLLAB_GOOGLE_CLIENT_ID=$COLLAB_GOOGLE_CLIENT_ID" >> local.properties

      - name: Validate packaging & verification scripts
        run: |
          chmod +x gradlew scripts/verify-android-upgrade.sh scripts/macos/package-macos.py scripts/macos/verify-macos-artifacts.py
          bash -n scripts/verify-android-upgrade.sh
          python3 -m py_compile scripts/macos/package-macos.py scripts/macos/verify-macos-artifacts.py

      - name: Run Shared, Desktop, Phone & TV Unit Tests
        run: |
          ./gradlew :shared:jvmTest :sharedUi:jvmTest :desktopUi:jvmTest :desktopApp:test :app:testDevDebugUnitTest :tv:testDevDebugUnitTest --max-workers=2

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-and-android-test-reports
          path: |
            shared/build/reports/tests/
            sharedUi/build/reports/tests/
            desktopUi/build/reports/tests/
            desktopApp/build/reports/tests/
            app/build/reports/tests/
            tv/build/reports/tests/

  macos-packaging:
    name: macOS Packaging · (${{ matrix.arch }})
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_macos_packaging)
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            java_arch: aarch64
          - arch: x64
            java_arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rosetta 2 for x64 on macos-14
        if: matrix.arch == 'x64'
        run: |
          if [ "$(uname -m)" = "arm64" ] && ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Set up JDK 21 (${{ matrix.java_arch }})
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: ${{ matrix.java_arch }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Package & Verify macOS Artifacts
        env:
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER }}
          COLLAB_SERVER: ${{ secrets.COLLAB_SERVER || vars.COLLAB_SERVER }}
          COLLAB_GOOGLE_CLIENT_ID: ${{ secrets.COLLAB_GOOGLE_CLIENT_ID || vars.COLLAB_GOOGLE_CLIENT_ID }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
        run: |
          chmod +x gradlew scripts/macos/package-macos.py scripts/macos/verify-macos-artifacts.py
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*.[0-9]*) ;;
            *) version="1.10.0" ;;
          esac
          python3 scripts/macos/package-macos.py \
            --version "$version" \
            --arch "${{ matrix.arch }}" \
            --output-dir dist
          python3 scripts/macos/verify-macos-artifacts.py \
            --expected-version "$version" \
            --expected-arch "${{ matrix.arch }}" \
            dist
