name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Secrets (Keystore & local.properties)
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER || vars.LISTEN_TOGETHER_SERVER }}
          COLLAB_SERVER: ${{ secrets.COLLAB_SERVER || vars.COLLAB_SERVER }}
          COLLAB_GOOGLE_CLIENT_ID: ${{ secrets.COLLAB_GOOGLE_CLIENT_ID || vars.COLLAB_GOOGLE_CLIENT_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : > local.properties
          [ -n "$LASTFM_API_KEY" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          [ -n "$LASTFM_SECRET" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
          [ -n "$LISTEN_TOGETHER_SERVER" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties
          [ -n "$COLLAB_SERVER" ] && echo "COLLAB_SERVER=$COLLAB_SERVER" >> local.properties
          [ -n "$COLLAB_GOOGLE_CLIENT_ID" ] && echo "COLLAB_GOOGLE_CLIENT_ID=$COLLAB_GOOGLE_CLIENT_ID" >> local.properties

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required Android release signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)." >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > bitchord-release.jks
          [ -s bitchord-release.jks ] || { echo "::error::Decoded bitchord-release.jks is empty!" >&2; exit 1; }
          keytool -list -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Grant execute permissions
        run: chmod +x gradlew scripts/verify-android-upgrade.sh

      - name: Build Signed Prod Release APKs
        run: ./gradlew :app:assembleProdRelease :tv:assembleProdRelease -Pbitchord.requireReleaseSigning=true -Dorg.gradle.workers.max=2

      - name: Verify Signed Release APKs
        env:
          EXPECTED_ANDROID_CERT_SHA256: ${{ secrets.EXPECTED_ANDROID_CERT_SHA256 || vars.EXPECTED_ANDROID_CERT_SHA256 }}
        run: |
          ./scripts/verify-android-upgrade.sh \
            app/build/outputs/apk/prod/release \
            tv/build/outputs/apk/prod/release \
            wearos/build/outputs/apk/prod/release

      - name: Upload Phone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-prod-release-signed
          path: app/build/outputs/apk/prod/release/*.apk

      - name: Upload TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-tv-prod-release-signed
          path: tv/build/outputs/apk/prod/release/*.apk

      - name: Upload Wear OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-wear-prod-release-signed
          path: wearos/build/outputs/apk/prod/release/*.apk
